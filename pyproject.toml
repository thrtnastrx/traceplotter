[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traceplotter"
version = "0.1.0"
description = "Apple Silicon-native continuous traceroute and remote subnet scanner for the lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
traceplotter = "traceplotter.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceplotter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
