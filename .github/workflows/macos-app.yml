name: macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build TracePlotter.app
        run: |
          chmod +x scripts/build-macos-app.sh
          ./scripts/build-macos-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TracePlotter-macos-arm64
          path: dist/TracePlotter-*-macos-arm64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="$(ls dist/TracePlotter-*-macos-arm64.zip | head -1)"
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "TracePlotter $VERSION" \
            --notes "$(cat <<EOF
          ## TracePlotter $VERSION (macOS Apple Silicon)

          Download **\`TracePlotter-${VERSION}-macos-arm64.zip\`**, unzip, and move \`TracePlotter.app\` to Applications.

          The build is unsigned. On first launch, right-click the app → **Open**, or clear quarantine:

          \`\`\`bash
          xattr -cr /Applications/TracePlotter.app
          \`\`\`

          Requires macOS 13+ on Apple Silicon.
          EOF
          )"
